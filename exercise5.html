<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design a layout</title>
    <style>
        *{
            padding: 0; margin: 0;
        }
        header{
            position: sticky;
            top: 0;
        }
        nav{
            background-color: pink;
            height: 83px ;
            
        }
        .container{
            background-color: aquamarine;
            margin: 12px  34px ;
            /* height: 233px ; */
            padding: 60px  23px ;
            text-align: center;
            
        }
        main{
            background-color: black;
            color: aliceblue;

        }
        .box1{
            background-color: rgb(106, 106, 239);
            height: 70vh ;
            width: 45%;
            display: inline-block;
            margin: 0 12px ;
        }
        .box2{
            background-color: springgreen;
            height: 70vh;
            width: 45% ;
            display: inline-block;
            margin: 0 12px ;
        }
        .textbox{
            padding: 34px;
            border: 2px solid rgb(236, 235, 235);
            margin:   0 34vw;
            border-radius: 13px;
            font-size: 2em;
        }
        .orangebox{
            
        }
        footer{
            height: 100px ;
            background-color: bisque;
        }
    </style>

</head>
<body>
    <header>
        <nav>

        </nav>

    </header>

    <main>
        <div class="container">
            <div class="box1">
            </div>
            <div class="box2"></div>

        </div>
        <div class="textbox">
            <p>Welcome to my Profile </p>
        </div>
        <div class="orangebox"></div>

    </main>
    <footer>
    
    </footer>
</body>
</html>
