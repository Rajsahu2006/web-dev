<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxmodel in CSS</title>
    <style>
        .box1{
            background-color: aquamarine;
            margin: 25px;
            padding: 10px;
            border: 2px solid black;
            height: 50px;
            box-sizing: border-box;

        }
        .box1{
            color:rgb(15, 124, 219)
            
        }
        .box2{
            color: rgb(232, 14, 14);
            background-color: aqua;
            padding: 10px;
            border: solid black;
        }
    </style>
</head>
<body>
    <div class = " box box1"> 
        Lorem ipsum dolor sit amet.
    </div>
    <div class = " box box2">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorem fugiat impedit ipsum asperiores. Sunt, dolorum.
    </div>
</body>
</html>
