<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserting and Removing Element </title>
    <style>
        body {
            height: 500px;
            width: auto;
            border: 2px solid black;
            background: -webkit-linear-gradient(830deg, #ea95f7, #f67f7f, #7ff36a);
            border-style: dashed;
            border-bottom-color: rgb(0, 10, 10);
            backdrop-filter: inherit;
            -moz-animation-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
        }

        .box {
            display: flex;
            height: 50px;
            width: 402px;
            margin: 30px;
            padding: 20px;
            border: 2px solid black;
            border-radius: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            font-style: oblique;
            font-display: fallback;
            font-variant: small-caps;
            box-shadow: 3px 3px 3px;
            text-decoration: line-through;
            text-shadow: 1px 1px 1px #ea95f7;
        }
        p{
            padding: 20px ;
            margin: 30px;
            font-family: Arial, Helvetica, sans-serif;
            font-style:inherit;
            font-variant: initial;
            
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">Hay i am a box</div>
    </div>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Voluptates facere molestiae harum vel possimus debitis
        ratione nemo ipsa, incidunt vero nihil ut odit nisi totam repudiandae, repellat minus excepturi et.</p>
    <script>
        document.querySelector(".box").style.backgroundColor = "yellow";
        // document.querySelector(".container").innerHTML = "hello "
        //ya function innerhtml  sentense ko chanfge kar deta ha ;

    </script>
</body>

</html>
