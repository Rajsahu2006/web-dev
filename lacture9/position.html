<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Position Property in Html</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box0{
            background: linear-gradient(240deg,#ef7d7d,#635263);
            font-size: xx-large;
            font-style:inherit;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            
        }
        .box1{
            background:linear-gradient(240deg,#0dd7e1,#ef7d7d);
            font-size: xx-large;
            font-style:inherit;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            
        }
        .box2{
            background:linear-gradient(240deg,#1ae308,#ef7d7d);
            font-size: xx-large;
            font-style:inherit;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            
        }
        .box3{
            background:linear-gradient(240deg,#ff34ff,#e5d207);
            font-size: xx-large;
            font-style:inherit;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            
        }
        .box{
            border: 2px solid black;
            height: 150px;
            width: 500px;
            margin: 3px;
            padding: 3px;
            
        }
    </style>
</head>
<body>
    <div class="box box0">This is Box 0</div>
    <div class="box box1">This is Box 1</div>
    <div class="box box2">This is Box 2</div>
    <div class="box box3">This is Box 3</div>

</body>
</html>
