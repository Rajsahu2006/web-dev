<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shodow</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 40px;
            margin: 50px;
            box-shadow: 5px 15px 5px #dc525288;
            background-color: aqua;
            text-shadow: 2px 2px 2px #b210ed88;
            outline-offset: 20px #1a08e7;
            border-radius: 30px;
        }
        .border{
            border: 2px #16d06a;
        outline-offset: 17px #932593;
        padding: 30px ;
        text-shadow: #e50c0c;
        }
    </style>
</head>
<body>
    <div class="box">
        I am box..
    </div>
    <div class="border">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. In, porro dolorem velit nulla rerum obcaecati dicta
        fugit. Tempore, ad eum.
        
    </div>
</body>

</html>
