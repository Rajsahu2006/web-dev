<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card</title>
    <style>
        body{
            background-color: rgb(211, 249, 113);
        }
        .Card{
            background-color: white;
            width: 244px;
            height: 344px;
            border-radius: 7px;
        }
        .image{
            padding: 5px;
        }
        .image img{
            border-radius: 7px;
        }
        .content{
            padding: 13px;
        }
        .capsules{
            padding: 0 34px;
        }
        .capsules span{
            border: 1px solid black;
            padding: 1px;
            border-radius: 7px;

        }
    </style>
</head>
<body>
    <div class="Card">
    <div class="image">
        <img  width="188" src="https://pixabay.com/images/download/nennieinszweidrei-bee-7478585_1920.jpg">
    </div>
    <div class="capsules">
        <span>Nature<span>
            <span>Honey Bee</span>

    </div>
    <div class="content">
        <h1>Card</h1>
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Velit, eum.
    </div>
    </div>
</body>
</html>
