<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design a nav bar</title>
    <style>
        body {
            background: linear-gradient(220deg, #333, #746);
        }

        nav {
            background-color: aquamarine;
        }

        ul li {
            list-style: none;
            display: inline;
            margin-left: 36px;
            padding: 20px;
            cursor: pointer;
            font-size: larger;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: rgb(1, 10, 10);

        }

        header h1 {
            color: white;
            align-items: center;
            padding-top: 30px;
            text-align: center;
            text-shadow: #f5dddd;
        }
        header span{
            padding-top: 20px ;
            margin-top: 30px ;
            color: rgb(5, 2, 4);
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li> Home</li>
                <li>Setting</li>
                <li>About</li>
                <li>services</li>
                <li>Contect us</li>
            </ul>
        </nav>
        <h1>Welcome</h1>
        <span>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Delectus natus magnam necessitatibus!
            Consectetur eaque iure labore quasi. Delectus, quae beatae.</span>
    </header>
</body>

</html>
