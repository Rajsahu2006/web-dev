<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selectors in CSS</title>
    <style>
        .box:first-child{
            background-color: antiquewhite;
            
        }
        .box::first-letter{
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div class="Boxes">
        <div class="box">Hey i am a box</div>
        <div class="box">Hey i am a box</div>
        <div class="box">Hey i am a box</div>
    </div>
</body>
</html>
