<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital clock</title>
    <style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    /* background-color: black; */
    background: linear-gradient(to right, #000000, #363535);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.light-theme{
background: rgb(140, 215, 247);
color: rgb(4, 4, 4);

}
.container{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}
#date{
    color: rgb(67, 219, 21);
    font-size: 1.5rem;
    font-family: Arial, sans-serif;
    border: 2px solid rgb(67, 243, 23);
    padding: 10px 20px ;
    margin-bottom: 10px ;
    border: 3px solid #00ff00;
    border-radius: 15px;
    text-shadow:
        0 0 5px #f16464,
        0 0 10px #e32b2b,
        0 0 20px #f94747,
        0 0 40px #eb4d4d;
        box-shadow: 
        
        0 0 10px #00ff00,
        0 0 20px #00ff00;

        animations: glow 1.5s infinite alternate;
        animation:cubic-bezier(0.23, 1, 0.320, 1);
}

#day{
    color: rgb(67, 219, 21);
    font-size: 1.5rem;
    font-family: Arial, sans-serif;
    border: 2px solid rgb(67, 243, 23);
    padding: 10px 20px ;
    margin-bottom: 10px ;
    border: 3px solid #00ff00;
    border-radius: 15px;
    text-shadow:
        0 0 5px #f16464,
        0 0 10px #e32b2b,
        0 0 20px #f94747,
        0 0 40px #eb4d4d;
        box-shadow: 
        
        0 0 10px #00ff00,
        0 0 20px #00ff00;

        
}

#clock{
    color: #00ff00;
    font-size: clamp(2rem, 8vw, 5rem);
    font-family: 'Courier New', monospace;
    font-weight: bold;
    padding: 20px 40px;
    border: 3px solid #00ff00;
    border-radius: 15px;

    text-shadow:
        0 0 5px #f16464,
        0 0 10px #e32b2b,
        0 0 20px #f94747,
        0 0 40px #eb4d4d;

    box-shadow:
        0 0 10px #00ff00,
        0 0 20px #00ff00;
}
#greeting{
    color: rgb(67, 219, 21);
    font-size: 1.5rem;
    font-family: Arial, sans-serif;
    border: 2px solid rgb(67, 243, 23);
    padding: 10px 20px ;
    margin-bottom: 10px ;
    border: 3px solid #00ff00;
    border-radius: 15px;
    box-shadow: 
        
        0 0 10px #00ff00,
        0 0 20px #00ff00;

    text-shadow:
        0 0 5px #f16464,
        0 0 10px #e32b2b,
        0 0 20px #f94747,
        0 0 40px #eb4d4d;    
}
#btn{
    padding: 10px 20px ;
    margin-top: 50px ;
    border:3px  solid white;
    border-radius:15px ;
    background-color: transparent;
    color:white;
    font-size: 1.2rem;
    cursor:pointer;
    transition: all 0.3s ease;
    box-shadow: 2px 2px 5px rgba(255, 255, 255, 0.5);
    
}
    </style>
</head>
<body>
    <div class="container">
        <div id="greeting"></div>
        <div id="day"></div>
        <div id="date"></div>
        <div id="clock">Clock</div>
        <button id="btn">Change Theme</button>
    </div>

    <script src = 'scrupt.js'></script>
</body>
</html>
