<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecting by ids </title>
    <style>
        .box{
            height: 34px ;
            width: 38px ;
            padding: 37px ;
            margin: 34px ;
            border: 2px solid black;
            background-color: aqua;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: 700;
            border-radius: 30px ;
            justify-content: center;
            align-items: center;
            border-color: rgb(255, 0, 0);
            box-shadow: 2px 2px 2px rgb(146, 98, 98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Bhupandra  jogi</div>
        <div id="csx"  class="box">Bhupandra  jogi 3.2</div>
        <div class="box">Bhupandra  jogi</div>
        <div class="box">Bhupandra  jogi</div>
        <div class="box">Bhupandra  jogi</div>
        <div class="box">Bhupandra  jogi</div>
    </div>
    <script>
            let bh = document.getElementsByClassName("box");
            console.log("bh");
            bh[3].style.backgroundColor = "blue";

            document.getElementById("csx").style.backgroundColor = "red";

            document.querySelectorAll(".box").forEach(e =>{
                e.style.backgroundColor = "pink" // return multileple element
            });

            document.getElementsByTagName("div");
    </script>
</body>
</html>
