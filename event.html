<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS events</title>
    <style>
        body{
            border: 2px solid black;
          
            background: -webkit-linear-gradient(#dc7373,#5587d7,#829782);
            color: rgb(18, 17, 17);
        }
        .box{
            margin-top: 20px ;
            align-items: center;
            justify-content: center;
            margin-left: 20px ;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: x-large;
            font-weight: bolder;


        }
        button{
            box-sizing: border-box;
            box-decoration-break: clone;
            background-color: rgb(134, 233, 134);
            padding:10px ;
            border: 2px solid black;
            border-radius: 20px ;
            margin-left: 70px ;
            margin-top: 300px ;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: 800;
            font-style:oblique ;
            box-shadow: 1rem 1rem 1rem #0c0c0c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Hay i am a box</div>
    </div>
    <button id="btn">Click me to change content</button>
    <script>
        let buttun = document.getElementById("btn")

        buttun.addEventListener("click",() =>{
            // alert("I was click")
            document.querySelector(".box").innerHTML = "<b> hay you were ckicked<b> Enjoy your click"

            })
            buttun.addEventListener("contextmenu",() =>{
                alert("Dont hack us by Right click please")
            })
            buttun.addEventListener("Keydown",(e) =>{
                // alert("Dont hack us by Right click please")
                console.log( e);
            })
    </script>
</body>
</html>
